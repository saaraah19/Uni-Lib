# Render Blueprint — UniLib (ONE web service)
#
# Express serves both the API (/api/*) and the built React app, so the whole site
# lives on a single URL with no CORS configuration.
#
# Deploy:  Render dashboard → New + → Blueprint → select this repository → Apply,
#          then fill in MONGODB_URI (marked `sync: false`) in the service's Environment tab.
#
# Prefer two services (static site + API)? See docs/render.two-services.yaml.

services:
  - type: web
    name: unilib
    runtime: node
    plan: free
    region: frankfurt            # closest Render region to Algeria — pick the same region for your Atlas cluster
    # 1) install + build the React app   2) install the API
    #   INLINE_RUNTIME_CHUNK=false  → required: the server's Content-Security-Policy forbids inline scripts
    #   GENERATE_SOURCEMAP=false    → faster build, lower memory on the free plan
    #   NODE_OPTIONS=…=350          → caps Node's heap: the build peaks ~640 MB uncapped (more than the
    #                                 free plan's 512 MB) and ~450 MB with this cap (measured locally)
    buildCommand: npm install --include=dev --prefix frontend && NODE_OPTIONS=--max-old-space-size=350 INLINE_RUNTIME_CHUNK=false GENERATE_SOURCEMAP=false npm run build --prefix frontend && npm install --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health # lightweight endpoint added for cold-start handling
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI         # MongoDB Atlas connection string
        sync: false
      - key: SECRET_KEY          # JWT signing key — generated for you
        generateValue: true
