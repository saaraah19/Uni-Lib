<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="UniLib - bibliothèque universitaire (Université Oran 2)"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      PERF/CONSISTENCY FIX (P2): removed the Tailwind CDN <script> that was
      loaded here alongside the local Tailwind build (postcss.config.js +
      tailwind.config.js). Loading both is explicitly discouraged by
      Tailwind's own docs for production: the CDN build is unminified,
      unpurged (much larger payload), can cause a flash of unstyled/
      differently-styled content, and can produce class-resolution
      conflicts with the locally compiled stylesheet. The local build
      (already wired via postcss) is the single source of truth now.
    -->

    <!-- START-UP PERFORMANCE: open the connection to the hero-image host early. -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <title>UniLib</title>

    <!--
      Runs before the React bundle downloads, so two things happen as early
      as possible (the bundle is the slow part of a first visit):
        1. the saved/system dark-mode preference is applied (no light flash
           and the splash below already matches the theme);
        2. for logged-out visitors on "/", the landing hero photo starts
           downloading in parallel with the JS bundle. Logged-in users are
           redirected to their dashboard, so they skip this download.
      KEEP IN SYNC: the hero URL must match HERO_IMAGE_URL in
      src/utils/criticalAssets.js (CRA cannot import JS into this file).
      Read-only on localStorage; the React app remains the source of truth.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var saved = localStorage.getItem('theme');
          if (
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            root.classList.add('dark');
          }
          if (location.pathname === '/' && !localStorage.getItem('token')) {
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';
            link.href =
              'https://images.unsplash.com/photo-1568667256549-094345857637?q=80&w=1920&auto=format&fit=crop';
            link.setAttribute('fetchpriority', 'high');
            document.head.appendChild(link);
          }
        } catch (e) {
          /* storage unavailable: nothing to do */
        }
      })();
    </script>

    <!-- Boot splash styles: inline so the splash paints before any bundle loads. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f9fafb;
        color: #1f2937;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.35s ease;
      }
      html.dark #boot-splash {
        background: #111827;
        color: #f3f4f6;
      }
      #boot-splash.boot-splash--hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .boot-logo {
        background: #fff;
        border-radius: 12px;
        padding: 8px 14px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
      }
      #boot-splash .boot-logo img {
        display: block;
        height: 56px;
        width: auto;
      }
      #boot-splash .boot-name {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      #boot-splash .boot-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(59, 130, 246, 0.25);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot-splash .boot-msg {
        margin: 0;
        font-size: 14px;
        opacity: 0.7;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <style>
        #boot-splash {
          display: none;
        }
      </style>
      Vous devez activer JavaScript pour utiliser cette application.
    </noscript>

    <!-- Shown instantly; removed by src/index.js once first-screen assets are ready. -->
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-logo">
        <img src="%PUBLIC_URL%/logo-oran2.jpg" alt="Université Oran 2" />
      </div>
      <div class="boot-name">UniLib</div>
      <div class="boot-spinner" aria-hidden="true"></div>
      <p class="boot-msg">Chargement de la bibliothèque…</p>
    </div>

    <div id="root"></div>

    <!-- Safety net: if the app bundle never starts, don't leave the splash up forever. -->
    <script>
      setTimeout(function () {
        var splash = document.getElementById('boot-splash');
        if (splash) splash.className += ' boot-splash--hide';
      }, 20000);
    </script>
  </body>
</html>
